name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Trusted Publishing exchanges a GitHub OIDC token for a short-lived publish
      # credential, so no NODE_AUTH_TOKEN is needed here. Do not pass registry-url:
      # it writes a .npmrc pointing at ${NODE_AUTH_TOKEN}, which shadows the OIDC
      # path and makes the publish fail with 404.
      # Configure it once at npmjs.com -> package -> Settings -> Trusted Publisher
      # (repository jcxy/huawei-obs-cli, workflow publish.yml, no environment).
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
