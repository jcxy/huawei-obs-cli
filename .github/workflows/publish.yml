name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Caching is deliberately off in release builds.
      # Trusted Publishing needs no NODE_AUTH_TOKEN: npm detects the OIDC
      # environment (id-token: write above) and exchanges it for a short-lived
      # credential. Configure it once at npmjs.com -> package -> Settings ->
      # Trusted Publisher (repository jcxy/huawei-obs-cli, workflow publish.yml,
      # no environment) and enable "Allow npm publish" under Allowed actions:
      # connections created after 2026-09-03 may only stage by default, and a
      # direct publish is then rejected by the registry with a 404.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
