name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted Publishing needs a recent npm CLI (OIDC token exchange).
      # Configure it once at https://www.npmjs.com/settings/cvtoolman/packages
      # -> package -> Trusted Publishers, or switch to a token by adding
      # NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} below.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
